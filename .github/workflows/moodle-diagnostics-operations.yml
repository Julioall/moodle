name: Moodle diagnostics operations

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/moodle-diagnostics-operations.yml
      - scripts/moodle-diagnostics-operations-remote.sh
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only host preflight or diagnostics query; raw bodies require separate opt-in
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - query
      query_kind:
        description: Query recent records, one call, or one external retry group
        type: choice
        required: true
        default: recent
        options:
          - recent
          - call_id
          - retry_group_id
          - capacity
      identifier:
        description: Required for call_id and retry_group_id; 32 lowercase hexadecimal characters
        type: string
        required: false
      window_hours:
        description: Preflight and recent-query lookback window
        type: choice
        required: true
        default: '24'
        options:
          - '1'
          - '6'
          - '24'
          - '168'
      max_rows:
        description: Maximum number of diagnostic rows in a query artifact
        type: choice
        required: true
        default: '100'
        options:
          - '20'
          - '100'
          - '500'
      include_raw_payload:
        description: Include raw error response bodies for one exact call_id in the one-day artifact
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: moodle-diagnostics-operations
  cancel-in-progress: false

jobs:
  operations:
    if: github.ref == 'refs/heads/master'
    name: Read-only Moodle diagnostics operation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      MODE: ${{ github.event_name == 'push' && 'preflight' || inputs.mode || 'preflight' }}
      QUERY_KIND: ${{ inputs.query_kind || 'recent' }}
      IDENTIFIER: ${{ inputs.identifier || '' }}
      WINDOW_HOURS: ${{ inputs.window_hours || '24' }}
      MAX_ROWS: ${{ inputs.max_rows || '100' }}
      INCLUDE_RAW_PAYLOAD: ${{ inputs.include_raw_payload && 'true' || 'false' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'MOODLE' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request and configuration
        shell: bash
        env:
          VPS_AUTH_SECRET: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo "::error::Operations may run only from master."; exit 1; }
          [[ "$MODE" == "preflight" || "$MODE" == "query" ]] || { echo "::error::Invalid operation mode."; exit 1; }
          [[ "$QUERY_KIND" == "recent" || "$QUERY_KIND" == "call_id" || "$QUERY_KIND" == "retry_group_id" || "$QUERY_KIND" == "capacity" ]] || { echo "::error::Invalid query kind."; exit 1; }
          [[ "$WINDOW_HOURS" == "1" || "$WINDOW_HOURS" == "6" || "$WINDOW_HOURS" == "24" || "$WINDOW_HOURS" == "168" ]] || { echo "::error::Invalid time window."; exit 1; }
          [[ "$MAX_ROWS" == "20" || "$MAX_ROWS" == "100" || "$MAX_ROWS" == "500" ]] || { echo "::error::Invalid row limit."; exit 1; }
          [[ "$INCLUDE_RAW_PAYLOAD" == "true" || "$INCLUDE_RAW_PAYLOAD" == "false" ]] || { echo "::error::Invalid raw payload option."; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,31}$ ]] || { echo "::error::Invalid VPS_USER configuration."; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::Invalid VPS_HOST configuration."; exit 1; }
          if [[ ! "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( VPS_SSH_PORT < 1 || VPS_SSH_PORT > 65535 )); then
            echo "::error::Invalid VPS_SSH_PORT configuration."
            exit 1
          fi
          [[ "$POSTGRES_DB" =~ ^[A-Za-z_][A-Za-z0-9_]{0,62}$ ]] || { echo "::error::Invalid POSTGRES_DB configuration."; exit 1; }
          [[ -n "$VPS_AUTH_SECRET" ]] || { echo "::error::Configure VPS_SSH_KEY in the moodle environment."; exit 1; }
          [[ -n "$VPS_SSH_HOST_KEY" && "$VPS_SSH_HOST_KEY" != *$'\n'* && "$VPS_SSH_HOST_KEY" != *$'\r'* ]] || { echo "::error::Configure one verified VPS_SSH_HOST_KEY in the moodle environment."; exit 1; }
          ssh_host_pattern="$VPS_HOST"
          if [[ "$VPS_SSH_PORT" != "22" ]]; then
            ssh_host_pattern="[$VPS_HOST]:$VPS_SSH_PORT"
          fi
          printf '%s %s\n' "$ssh_host_pattern" "$VPS_SSH_HOST_KEY" > "$RUNNER_TEMP/moodle-diagnostics-known-hosts"
          chmod 600 "$RUNNER_TEMP/moodle-diagnostics-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/moodle-diagnostics-known-hosts" >/dev/null 2>&1 || { echo "::error::VPS_SSH_HOST_KEY is not a valid OpenSSH public host key."; exit 1; }
          ssh-keygen -F "$ssh_host_pattern" -f "$RUNNER_TEMP/moodle-diagnostics-known-hosts" >/dev/null 2>&1 || { echo "::error::VPS_SSH_HOST_KEY does not match the configured VPS host and port."; exit 1; }
          if [[ "$MODE" == "query" ]]; then
            if [[ "$QUERY_KIND" == "call_id" || "$QUERY_KIND" == "retry_group_id" ]]; then
              [[ "$IDENTIFIER" =~ ^[a-f0-9]{32}$ ]] || { echo "::error::identifier must contain exactly 32 lowercase hexadecimal characters."; exit 1; }
            elif [[ -n "$IDENTIFIER" ]]; then
              echo "::error::identifier must be empty for recent and capacity queries."
              exit 1
            fi
          fi
          if [[ "$INCLUDE_RAW_PAYLOAD" == "true" && ( "$MODE" != "query" || "$QUERY_KIND" != "call_id" ) ]]; then
            echo "::error::Raw payload retrieval requires query mode with one exact call_id."
            exit 1
          fi
          if printf '%s' "$VPS_AUTH_SECRET" | grep -q 'BEGIN .*PRIVATE KEY'; then
            printf '%s\n' "$VPS_AUTH_SECRET" > "$RUNNER_TEMP/moodle-diagnostics-deploy-key"
            chmod 600 "$RUNNER_TEMP/moodle-diagnostics-deploy-key"
            echo "VPS_AUTH_MODE=key" >> "$GITHUB_ENV"
          else
            echo "VPS_AUTH_MODE=password" >> "$GITHUB_ENV"
          fi

      - name: Configure SSH access
        shell: bash
        env:
          VPS_AUTH_SECRET: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cp "$RUNNER_TEMP/moodle-diagnostics-known-hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [[ "$VPS_AUTH_MODE" == "password" ]]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi

      - name: Transfer read-only operation script
        shell: bash
        env:
          VPS_AUTH_SECRET: ${{ secrets.VPS_SSH_KEY }}
          DIAGNOSTICS_DB_READER_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'query' && secrets.DIAGNOSTICS_DB_READER_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "query" ]]; then
            [[ "$DIAGNOSTICS_DB_READER_PASSWORD" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Configure a 64-character lowercase hexadecimal DIAGNOSTICS_DB_READER_PASSWORD."; exit 1; }
          fi
          remote_path="/tmp/moodle-diagnostics-operations-${GITHUB_RUN_ID}.sh"
          chmod 700 scripts/moodle-diagnostics-operations-remote.sh
          destination="$VPS_USER@$VPS_HOST:$remote_path"
          if [[ "$VPS_AUTH_MODE" == "key" ]]; then
            scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$RUNNER_TEMP/moodle-diagnostics-deploy-key" -P "$VPS_SSH_PORT" \
              scripts/moodle-diagnostics-operations-remote.sh "$destination"
          else
            SSHPASS="$VPS_AUTH_SECRET" sshpass -e scp -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$VPS_SSH_PORT" \
              scripts/moodle-diagnostics-operations-remote.sh "$destination"
          fi

      - name: Execute preflight or diagnostics query
        shell: bash
        env:
          VPS_AUTH_SECRET: ${{ secrets.VPS_SSH_KEY }}
          DIAGNOSTICS_DB_READER_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'query' && secrets.DIAGNOSTICS_DB_READER_PASSWORD || '' }}
        run: |
          set -euo pipefail
          umask 077
          remote_path="/tmp/moodle-diagnostics-operations-${GITHUB_RUN_ID}.sh"
          remote_command="bash '$remote_path' '$MODE' '$WINDOW_HOURS' '$QUERY_KIND' '$IDENTIFIER' '$MAX_ROWS' '$POSTGRES_DB' '$INCLUDE_RAW_PAYLOAD'"
          destination="$VPS_USER@$VPS_HOST"
          report="$RUNNER_TEMP/moodle-diagnostics-report.json"
          error_file="$RUNNER_TEMP/moodle-diagnostics-ssh-error.txt"
          report_database_query_failure() {
            local sqlstate
            sqlstate="$(python3 - "$error_file" <<'PY'
          import re
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8", errors="replace") as source:
                  output = source.read()
          except OSError:
              output = ""
          match = re.search(r"Sanitized diagnostics query failed \(SQLSTATE ([0-9A-Z]{5})\)\.", output)
          print(match.group(1) if match else "")
          PY
          )"
            if [[ "$sqlstate" =~ ^[0-9A-Z]{5}$ ]]; then
              echo "::error::The diagnostics database query failed (SQLSTATE ${sqlstate}); remote output was withheld."
            else
              echo "::error::The diagnostics database query failed; remote output was withheld."
            fi
          }
          if [[ "$VPS_AUTH_MODE" == "key" ]]; then
            if [[ "$MODE" == "query" ]]; then
              if ! printf '%s\n' "$DIAGNOSTICS_DB_READER_PASSWORD" | ssh \
                -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -i "$RUNNER_TEMP/moodle-diagnostics-deploy-key" -p "$VPS_SSH_PORT" \
                "$destination" "$remote_command" > "$report" 2> "$error_file"; then
                report_database_query_failure
                exit 1
              fi
            elif ! ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$RUNNER_TEMP/moodle-diagnostics-deploy-key" \
              -p "$VPS_SSH_PORT" "$destination" "$remote_command" > "$report" 2> "$error_file"; then
              echo "::error::The read-only host preflight failed; remote output was withheld."
              exit 1
            fi
          else
            if [[ "$MODE" == "query" ]]; then
              if ! printf '%s\n' "$DIAGNOSTICS_DB_READER_PASSWORD" | SSHPASS="$VPS_AUTH_SECRET" sshpass -e ssh \
                -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -p "$VPS_SSH_PORT" "$destination" "$remote_command" > "$report" 2> "$error_file"; then
                report_database_query_failure
                exit 1
              fi
            elif ! SSHPASS="$VPS_AUTH_SECRET" sshpass -e ssh -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -p "$VPS_SSH_PORT" "$destination" "$remote_command" > "$report" 2> "$error_file"; then
              echo "::error::The read-only host preflight failed; remote output was withheld."
              exit 1
            fi
          fi
          python3 -m json.tool "$report" > /dev/null
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Publish short-lived diagnostics report
        uses: actions/upload-artifact@v4
        with:
          name: moodle-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/moodle-diagnostics-report.json
          retention-days: 1
          if-no-files-found: error

      - name: Summarize report without exposing event rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$REPORT_PATH" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("# Moodle diagnostics operation\n\n")
              summary.write(f"- Mode: `{report['mode']}`\n")
              if report['mode'] == 'preflight':
                  summary.write(f"- Requested metric window: `{report['requestedWindowHours']}h`; observed coverage: `{report['metricsCoverageHours']}` hours.\n")
                  summary.write(f"- Calls / failures / transport attempts: `{report['moodleWebServiceCalls']}` / `{report['moodleWebServiceFailures']}` / `{report['moodleTransportAttempts']}`.\n")
                  summary.write(f"- Daily event upper bound: `{report['dailyEventUpperBound']}`; 30-day projection: `{report['projection30dBytes']}` bytes.\n")
                  summary.write(f"- Raw payload 8-day upper bound: `{report['rawPayload8dUpperBoundBytes']}` bytes; combined projection: `{report['projectionTotalBytes']}` bytes.\n")
                  summary.write(f"- Minimum relevant free space: `{report['minimumRelevantFreeBytes']}` bytes; estimated 2x capacity gate: `{report['capacityGateEstimate']}`.\n")
                  summary.write(f"- Container rotation gate: `{report['rotationGate']}`. External backup destinations need separate confirmation.\n")
              else:
                  summary.write(f"- Query rows: `{report['rowCount']}`. The JSON report is available as a one-day artifact.\n")
                  summary.write(f"- Raw error response bodies included: `{report.get('rawPayloadIncluded', False)}`. When true, treat the one-day artifact as sensitive.\n")
                  if report.get('rows') and 'estimatedLiveRows' in report['rows'][0]:
                      capacity = report['rows'][0]
                      summary.write(f"- Raw payload table rows/bytes: `{capacity['rawPayloadRows']}` / `{capacity['rawPayloadRelationBytes']}`. Reader SELECT `{capacity['hasRawPayloadSelect']}`; operator writes `{capacity['canModifyRawPayloads']}`.\n")
                      summary.write(f"- Estimated live diagnostics rows: `{capacity['estimatedLiveRows']}`; estimated bytes/row including indexes: `{capacity['estimatedBytesPerLiveRow']}`; total relation bytes: `{capacity['totalRelationBytes']}`.\n")
                      summary.write(f"- Read-only role: diagnostics/schema SELECT `{capacity['hasDiagnosticsSelect']}`/`{capacity['hasSchemaVersionSelect']}`, connector clients SELECT `{capacity['hasConnectorClientsSelect']}`, diagnostics writes `{capacity['canModifyDiagnostics']}`, table-owner membership `{capacity['canAssumeDiagnosticsOwner']}`, public CREATE `{capacity['hasPublicCreate']}`, superuser `{capacity['isSuperuser']}`, CREATEDB `{capacity['canCreateDb']}`, CREATEROLE `{capacity['canCreateRole']}`.\n")
                  summary.write(f"- GitHub actor: `{os.environ['GITHUB_ACTOR']}`; run id: `{os.environ['GITHUB_RUN_ID']}`.\n")
          PY
