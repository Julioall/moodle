name: Validacao documental

on:
  push:
    branches:
      - master
      - dev
    paths:
      - docs/**
      - scripts/check-documentation.ps1
      - .github/workflows/docs-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-documentation:
    name: Validar documentação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/check-documentation.ps1
