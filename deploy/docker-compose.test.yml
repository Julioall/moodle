services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MOODLE_POSTGRES_TEST_DATABASE:-MOODLE_ci_test}
      POSTGRES_USER: ${MOODLE_POSTGRES_TEST_USERNAME:-MOODLE}
      POSTGRES_PASSWORD: ${MOODLE_POSTGRES_TEST_PASSWORD:-ci-postgres-password}
    ports:
      - "127.0.0.1:${MOODLE_POSTGRES_TEST_PORT:-5433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30
